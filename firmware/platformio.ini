; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:xiaoblesense]
platform = https://github.com/maxgerhardt/platform-nordicnrf52
; Adafruit nRF52 core (SoftDevice S140) - required for the Bluefruit library
board = xiaoblesense_adafruit
framework = arduino
monitor_speed = 115200
; Note: the Adafruit XIAO Sense variant.h already defines
; TARGET_SEEED_XIAO_NRF52840_SENSE, which makes the Seeed LSM6DS3 library
; talk to the internal IMU on Wire1 - no extra build flag needed.
lib_deps =
	seeed-studio/Seeed Arduino LSM6DS3 @ ^2.0.3
